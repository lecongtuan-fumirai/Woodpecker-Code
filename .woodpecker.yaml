when:
  - event: [push, manual]

steps:
  # ==========================================
  # 1. Build Frontend
  # ==========================================
  - name: build-frontend
    image: node:20-alpine
    commands:
      - echo ">>> [1/3] Cai dat dependencies va Build Frontend..."
      - npm install
      - npm run build
      - ls -la dist/

  # ==========================================
  # 2. Verify Build Output
  # ==========================================
  - name: test-and-verify
    image: alpine:latest
    commands:
      - echo ">>> [2/3] Kiem tra tinh toan ven cua bundle..."
      - test -f dist/index.html
      - echo "dist/index.html ton tai hop le!"
      - uname -a
      - nproc

  # ==========================================
  # 3. Pipeline Summary
  # ==========================================
  - name: pipeline-summary
    image: alpine:latest
    commands:
      - echo "=========================================================="
      - echo "  🎉 PIPELINE THANH CONG RUC RO TRÊN LOCAL RUNNER!"
      - 'echo "  Commit: ${CI_COMMIT_SHA}"'
      - 'echo "  Branch: ${CI_COMMIT_BRANCH}"'
      - 'echo "  Author: ${CI_COMMIT_AUTHOR}"'
      - echo "=========================================================="
