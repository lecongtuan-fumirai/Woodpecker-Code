# ==============================================================================
#  WOODPECKER CI/CD ENTERPRISE PIPELINE
#  Tuan thu chuan DevSecOps: Test -> Build -> Verify -> Security Scan -> Docker
# ==============================================================================
when:
  - event: [push, pull_request, manual]

steps:
  # ----------------------------------------------------------------------------
  # Stage 1: Dependency Installation & Automated Unit Testing
  # ----------------------------------------------------------------------------
  - name: test-and-build
    image: node:20-alpine
    commands:
      - echo "=========================================================="
      - echo "  STAGE 1 - TESTING & COMPILING FRONTEND ASSETS"
      - echo "=========================================================="
      - npm install
      - echo ">>> Running Automated Unit Tests..."
      - npm test
      - echo ">>> Compiling production bundle with Vite..."
      - npm run build
      - ls -lh dist/

  # ----------------------------------------------------------------------------
  # Stage 2: Bundle Integrity Verification
  # ----------------------------------------------------------------------------
  - name: verify-artifact
    image: alpine:latest
    commands:
      - echo "=========================================================="
      - echo "  STAGE 2 - ARTIFACT INTEGRITY VERIFICATION"
      - echo "=========================================================="
      - test -s dist/index.html || exit 1
      - echo "Artifact dist/index.html is valid and ready for deployment."
      - sha256sum dist/index.html

  # ----------------------------------------------------------------------------
  # Stage 3: Security & Secret Vulnerability Scan (DevSecOps)
  # ----------------------------------------------------------------------------
  - name: security-scan
    image: aquasec/trivy:latest
    commands:
      - echo "=========================================================="
      - echo "  STAGE 3 - TRIVY SECURITY & SECRET SCANNING"
      - echo "=========================================================="
      - trivy fs --scanners secret,vuln --severity CRITICAL --exit-code 0 .

  # ----------------------------------------------------------------------------
  # Stage 4: Docker Container Build (Kaniko Unprivileged Sandbox)
  # ----------------------------------------------------------------------------
  - name: docker-build
    image: woodpeckerci/plugin-kaniko
    settings:
      repo: ${CI_REPO_OWNER}/woodpecker-fe-demo
      tags:
        - ${CI_COMMIT_SHA:0:8}
        - latest
      dockerfile: Dockerfile
      no_push: true

  # ----------------------------------------------------------------------------
  # Stage 5: Pipeline Completion & Traceability Summary
  # ----------------------------------------------------------------------------
  - name: pipeline-summary
    image: alpine:latest
    commands:
      - echo "=========================================================="
      - echo "  PIPELINE PASSED (100% SUCCESS)"
      - 'echo "  Repository : ${CI_REPO}"'
      - 'echo "  Branch     : ${CI_COMMIT_BRANCH}"'
      - 'echo "  Commit SHA : ${CI_COMMIT_SHA}"'
      - 'echo "  Author     : ${CI_COMMIT_AUTHOR}"'
      - 'echo "  Status     : Ready for Production Deployment"'
      - echo "=========================================================="
